name: Isolated pre-release acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  free-isolated-checks:
    # Automatic push/PR testing was cancelled by the user on 2026-11-05.
    # Manual use remains guarded before allocating any hosted runner.
    if: >-
      github.repository == 'YuenHK/neighbour-cloud' &&
      vars.NEIGHBOUR_CI_FREE_ONLY == 'confirmed-zero-dollar-hard-stop' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: pip install -r deploy/cloud/requirements.txt pytest==8.4.2 websockets==16.0 opencv-python-headless==4.13.0.92
      - run: npm install --prefix .acceptance-node --ignore-scripts @playwright/test@1.64.1 promptfoo@0.125.1 typescript@5.9.3 three@0.184.0
      - run: .acceptance-node/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Routing, media, permissions, transport faults and browser
        env:
          NODE_PATH: ${{ github.workspace }}/.acceptance-node/node_modules
        run: python tools/acceptance_gate.py --network-faults --browser
      # No deploy, upload-artifact, paid runner, caching, production credentials,
      # hardware, microphone or real model/voice requests. Local acceptance and
      # a separate stopped-writer handover remain mandatory for deployment.
