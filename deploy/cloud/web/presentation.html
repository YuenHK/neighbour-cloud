<section id="panel-avatar" role="tabpanel" aria-labelledby="tab-avatar" hidden><section class="service-card">
<h2>數字人設定</h2><p class="service-muted">調整居民見到的稱呼、開場白同聊天語氣。對話繼續用 Gemma，廣東話繼續用曉曼。</p>
<form id="cloudPresentationForm"><label>數字人稱呼<input id="presentationName" maxlength="40" required></label>
<label>開場白<textarea id="presentationGreeting" rows="2" maxlength="200" required></textarea></label>
<label>聊天風格<textarea id="presentationPersona" rows="4" maxlength="1200" placeholder="例如：像熟悉的好鄰居，先聽居民講完，溫柔接話，唔好不停追問。"></textarea></label>
<label>畫面色調<select id="presentationBackground"><option value="mint">柔和薄荷綠</option><option value="sky">清新淺藍</option><option value="warm">溫暖米色</option></select></label>
<button type="submit">儲存設定</button><p id="presentationStatus" role="status">開啟此分頁後載入設定。</p></form>
</section></section>
