<section id="panel-robots" role="tabpanel" aria-labelledby="tab-robots" hidden>
  <section class="service-card"><h2>機械人控制</h2>
    <p>現場與街外使用同一套機體控制台。街外遙控需現場電腦開機、同 EP 在同一網絡，並由獲准的 Google 帳戶登入。</p>
    <div class="button-row"><a class="button" href="http://127.0.0.1:8000/robots" target="_blank" rel="noopener noreferrer">開啟現場控制台</a><a class="button" id="remoteRobotConsole" target="_blank" rel="noopener noreferrer" hidden>開啟街外控制台</a></div>
    <p id="robotConsoleStatus" role="status">正在核對現場入口…</p>
    <details><summary>現場電腦未啟動控制台？</summary><p>在已安裝鄰伴的現場電腦執行 START-ROBOT-CONSOLE.cmd；需要街外遙控時，再執行 START-ROBOT-REMOTE.cmd。啟動程式不會自行連接、開鏡頭或移動 EP，由職員在控制台操作。</p></details>
  </section>
</section>
