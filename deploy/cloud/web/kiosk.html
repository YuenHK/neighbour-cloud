<section class="service-card kiosk-setup" aria-labelledby="kioskHeading">
  <details>
    <summary id="kioskHeading">智能屏幕準備</summary>
    <p>沒有鍵盤或滑鼠的屏幕，可用居民頁的語音及手勢。首次安裝請由職員完成瀏覽器權限，再交給居民使用。</p>
    <div class="kiosk-actions"><button id="kioskCheck" type="button">檢查此裝置</button><button id="kioskFullscreen" type="button">全螢幕</button><a id="kioskOpenResident" href="/?workspace=resident" target="_top">開啟居民畫面</a></div>
    <p id="kioskStatus" role="status">檢查只讀取瀏覽器支援及現有權限，不會開咪、開鏡頭或播放聲音。</p>
    <dl id="kioskChecks" class="kiosk-checks" hidden></dl>
    <ol class="kiosk-instructions"><li>職員先在居民頁點語音掣，允許咪高峰並實測收音及朗讀。</li><li>需要手勢時，在居民頁開啟手勢導覽並允許鏡頭：張掌移動游標、停留後捏合確認；握拳暫停。</li><li>離開前實測三分鐘交接及下一位。鏡頭開啟狀態會清楚顯示；拍照仍須居民預覽及確認。</li></ol>
    <p class="kiosk-note">網頁不能代批權限或繞過鎖屏。裝置重新啟動後自動開啟、權限保存及固定 kiosk 模式，要在選定屏幕的作業系統設定；本頁不會更改系統設定。</p>
  </details>
</section>
